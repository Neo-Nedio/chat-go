services:
  etcd:
    image: bitnami/etcd:3.4.15
    container_name: etcd
    ports:
      - "3379:2379"
      - "3380:2380"
    environment:
      - ETCD_ENABLE_V2=true
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_NAME=etcd
    volumes:
      - etcd_data:/bitnami/etcd/data
      - etcd_logs:/bitnami/etcd/logs
    networks:
      chat:

  redis:
    image: redis:alpine3.18
    ports:
      - 16379:6379
    container_name: redis
    volumes:
      - redis_data:/data
    environment:
      TZ: Asia/Shanghai
    restart: always
    networks:
      chat:
    command: redis-server --requirepass test --appendonly yes

  mysql:
    image: mysql:5.7
    ports:
      - 13306:3306
    container_name: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/sql/user.sql:/docker-entrypoint-initdb.d/01-user.sql:ro
      - ./deploy/sql/wuid.sql:/docker-entrypoint-initdb.d/02-wuid.sql:ro
      - ./deploy/sql/social.sql:/docker-entrypoint-initdb.d/03-social.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: chat-go
      TZ: Asia/Shanghai
    restart: always
    networks:
      chat:

networks:
  chat:
    name: chat
    driver: bridge

volumes:
  etcd_data:
  etcd_logs:
  redis_data:
  mysql_data:
