services:
  etcd:
    image: bitnami/etcd:3.4.15
    container_name: etcd
    ports:
      - "3379:2379"
      - "3380:2380"
    environment:
      - ETCD_ENABLE_V2=true
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_NAME=etcd
    volumes:
      - etcd_data:/bitnami/etcd/data
      - etcd_logs:/bitnami/etcd/logs
    networks:
      chat:

  redis:
    image: redis:alpine3.18
    ports:
      - 16379:6379
    container_name: redis
    volumes:
      - redis_data:/data
    environment:
      TZ: Asia/Shanghai
    restart: always
    networks:
      chat:
    command: redis-server --requirepass test --appendonly yes

  mysql:
    image: mysql:5.7
    ports:
      - 13306:3306
    container_name: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/sql/user.sql:/docker-entrypoint-initdb.d/01-user.sql:ro
      - ./deploy/sql/wuid.sql:/docker-entrypoint-initdb.d/02-wuid.sql:ro
      - ./deploy/sql/social.sql:/docker-entrypoint-initdb.d/03-social.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: chat-go
      TZ: Asia/Shanghai
    restart: always
    networks:
      chat:

  mongo:
    image: mongo:4.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: chat
    ports:
      - 47017:27017
    volumes:
      - ./components/mongo/data:/data/db
      - /etc/localtime:/etc/localtime
    restart: always
    networks:
      chat:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - 2181:2181
    container_name: zookeeper
    volumes:
      - /etc/localtime:/etc/localtime
    environment:
      TZ: Asia/Shanghai
    restart: always
    networks:
      chat:

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    restart: always
    ports:
      - 9092:9092
    environment:
      TZ: Asia/Shanghai
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "ws2ms_chat:8:1,ms2ps_chat:8:1,msg_to_mongo:8:1"
      #✨注意：填写的是当前宿主机的ip，即对外能够访问到Kafka的地址
      # 这是因为 ：在go-zero的消息队列组件中，默认监听的是本机的ip，即本机不能访问外网
      KAFKA_ADVERTISED_LISTENERS: INSIDE://192.168.117.24:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LISTENERS: INSIDE://:9092
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    depends_on:
      - zookeeper
    networks:
      chat:


networks:
  chat:
    name: chat
    driver: bridge

volumes:
  etcd_data:
  etcd_logs:
  redis_data:
  mysql_data:
